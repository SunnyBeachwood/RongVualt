plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

def releaseProperties = [
        'EDS_RELEASE_STORE_FILE',
        'EDS_RELEASE_STORE_PASSWORD',
        'EDS_RELEASE_KEY_ALIAS',
        'EDS_RELEASE_KEY_PASSWORD'
]
def localReleaseProperties = new Properties()
def localReleasePropertiesFile = rootProject.file('release-signing.properties')
if (localReleasePropertiesFile.isFile()) {
    localReleasePropertiesFile.withInputStream { localReleaseProperties.load(it) }
}
def releaseProperty = { name -> providers.gradleProperty(name).orElse(localReleaseProperties.getProperty(name, '')).get() }
def hasReleaseSigning = releaseProperties.every { !releaseProperty(it).isBlank() }
def sourceUrl = releaseProperty('RONGVAULT_SOURCE_URL')

android {
    namespace 'com.sovworks.eds.android'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        // The Java package remains stable during the staged migration. The
        // installable identity is new and can be overridden for private builds.
        applicationId providers.gradleProperty('EDS_APPLICATION_ID').orElse('app.rongvault').get()
        minSdk 35
        targetSdk 37
        versionCode 10
        versionName '1.4.1'
        buildConfigField 'String', 'RONGVAULT_SOURCE_URL', '"' + sourceUrl.replace('"', '\\"') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseProperty('EDS_RELEASE_STORE_FILE'))
                storePassword releaseProperty('EDS_RELEASE_STORE_PASSWORD')
                keyAlias releaseProperty('EDS_RELEASE_KEY_ALIAS')
                keyPassword releaseProperty('EDS_RELEASE_KEY_PASSWORD')
            }
        }
    }

    flavorDimensions 'edition'
    productFlavors {
        lite {
            dimension 'edition'
            externalNativeBuild {
                cmake {
                    targets 'vc_core', 'syscall'
                }
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    cFlags '-DDEBUG'
                }
            }
        }
        // Reproducible on-device performance build: release-style native
        // optimization with a debug signing identity. It is intentionally not
        // a publishable release artifact and does not relax release signing.
        benchmark {
            initWith release
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments '-DVC_CORE_BENCHMARK=ON'
                }
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-lite.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    // Lite ships the new SAF product surface only. Imported EDS Java UI,
    // resources, formats and JNI wrappers stay in the worktree as reference
    // sources and are not compiled or packaged for this variant.
    sourceSets {
        main {
            java.setSrcDirs([])
            res.setSrcDirs(['src/veracrypt/res'])
        }
        lite {
            java.setSrcDirs([])
            res.setSrcDirs([])
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging {
        jniLibs {
            // ZipXtract's JBinding/libarchive loaders use System.loadLibrary;
            // keep the native payload in the extractable form used by the
            // upstream Android packaging configuration.
            useLegacyPackaging true
            keepDebugSymbols += [
                    'lib7-Zip-JBinding.so',
                    'libarchive-jni.so',
                    'libzstd-jni-1.5.7-2.so'
            ]
        }
        resources {
            excludes += [
                    'META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt',
                    'META-INF/NOTICE', 'META-INF/DEPENDENCIES'
            ]
        }
    }
}

// 发布包名称面向下载者，而不是 Gradle 变体名。仅生成 arm64-v8a 的正式包。
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("RongVualt-${android.defaultConfig.versionName}-arm64_v8.apk")
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation(project(':materialfiles')) {
        // Android supplies org.xmlpull.v1. Shipping xpp3 as well makes R8 see
        // the platform interface as both a program and library class.
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Material Files exposes its java8.nio Path bridge in the Activity API.
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    implementation 'me.zhanghai.android.retrofile:library:1.1.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'commons-net:commons-net:3.8.0'
}

// Release artifacts must never be produced with a fallback, debug, or
// source-controlled signing identity.
tasks.configureEach {
    if (name.toLowerCase(Locale.ROOT).contains('release')) {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing is required. Supply all EDS_RELEASE_* Gradle properties outside source control.')
            }
            if (!(sourceUrl ==~ /^https:\/\/.+/)) {
                throw new GradleException('Release source availability is required. Supply an HTTPS RONGVAULT_SOURCE_URL Gradle property.')
            }
        }
    }
}

// Product-facing resources must never leak the embedded file manager's brand.
// Legal Markdown is intentionally excluded because it attributes Material Files.
tasks.register('verifyRongVaultBranding') {
    doLast {
        def forbidden = ['质感文件', 'Material Files']
        def offenders = fileTree('src/veracrypt/res') {
            exclude 'raw/**', 'raw-*/**'
        }.findAll { file ->
            file.isFile() && forbidden.any { marker -> file.getText('UTF-8').contains(marker) }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("RongVault branding leak in: ${offenders*.path.join(', ')}")
        }
    }
}
tasks.named('check').configure { dependsOn(tasks.named('verifyRongVaultBranding')) }
